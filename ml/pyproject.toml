[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instruction-ml"
version = "0.1.0"
description = "Standalone instruction-to-action ML project (Audelle ML coursework)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
transformer = ["torch>=2.0", "transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
